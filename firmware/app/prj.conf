# Pod firmware (B-904), common to both boards.

# Logging (RTT on the pod, UART on the DK through the board conf).
CONFIG_LOG=y
CONFIG_POD_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Peripherals.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_HWINFO=y

# The nRF52840 WDT is mandatory (pod-v0.md): never disabled at boot by the bootloader either.
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# System OFF (sys_poweroff) for the "System OFF" power state.
CONFIG_POWEROFF=y

# LoRa: SX1262 driver of Zephyr (loramac-node HAL).
CONFIG_LORA=y

# IMU (LSM6DSV320X) and barometer (BMP581) drivers.
CONFIG_SENSOR=y

# Persistent counters (boot counter, page sequence reservation, segment id): NVS in the
# internal flash (ADR 0106).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# PSA Crypto on the CryptoCell-310 (nrf_security): AES-128 CTR, CMAC, CCM and HKDF-SHA256.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_128=y
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# Sysbuild: MCUboot with signed images (ADR 0106, "Arranque seguro"), swap with test and
# confirm and automatic revert.
#
# SIGNING KEY: this file does NOT set SB_CONFIG_BOOT_SIGNATURE_KEY_FILE, so development builds
# (and CI) sign with MCUboot's public development key (bootloader/mcuboot/root-ec-p256.pem).
# That key is public: an image signed with it must never reach a pod in the field. Release
# builds pass -DSB_CONFIG_POD_RELEASE_BUILD=y and -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=<key
# outside the repository>; sysbuild.cmake refuses a release signed with the development key.
# No key is committed to the repository (firmware/README.md, "Firma y MCUboot").
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

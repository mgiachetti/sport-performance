packages:
  - apps/*
  - packages/*
  # Railway project as code (B-701, ADR 0090): `.railway/railway.ts` and its checks.
  - .railway

# esbuild (via drizzle-kit) works from its platform optionalDependency; its postinstall
# only re-verifies the binary, so it is not allowed to run.
allowBuilds:
  esbuild: false
  # @sentry/cli (via @sentry/react-native) takes its binary from a platform optionalDependency;
  # its postinstall only re-checks or downloads it again, so it is not allowed to run.
  '@sentry/cli': false

patchedDependencies:
  expo-video-thumbnails@58.0.2: patches/expo-video-thumbnails@58.0.2.patch

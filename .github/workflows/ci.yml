# Lint, typecheck, test and build every package through Turborepo (B-102).
# The aggregate `ci` job is the single required status check on `main`: keep its name stable
# and add every new job to its `needs` (enforced by the `workflows` job).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Real Postgres for DB integration and RLS tests, as CLAUDE.md requires.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sport_performance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sport_performance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway credentials of the ephemeral service container; not a secret.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sport_performance_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check Postgres connection
        run: psql "$DATABASE_URL" --no-psqlrc --tuples-only --command 'select version();'
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only job that saves the pnpm store, so each run adds a single entry.
      - uses: ./.github/actions/setup
        with:
          save-pnpm-cache: 'true'
      - run: pnpm build

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint also runs shellcheck on every `run:` script.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      - name: Test the aggregate check
        run: sh .github/scripts/check-ci-aggregate.test.sh
      - name: Check that `ci` aggregates every job
        run: sh .github/scripts/check-ci-aggregate.sh .github/workflows/ci.yml

  # Single required check. Runs even when a dependency fails so that a failed, cancelled or
  # skipped job makes it fail (a skipped required check would otherwise count as passing).
  ci:
    name: ci
    if: always()
    needs: [format, lint, typecheck, test, build, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi

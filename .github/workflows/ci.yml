# Lint, typecheck, test and build every package through Turborepo (B-102).
# The aggregate `ci` job is the single required status check on `main`: keep its name stable
# and add every new job to its `needs` (enforced by the `workflows` job).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR shares one group, so a new push cancels its superseded run. Each push to main gets its
# own group (keyed by commit SHA): GitHub keeps only one pending run per group and would
# otherwise drop queued main runs, so every commit on main gets a full run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Real Postgres for DB integration and RLS tests, as CLAUDE.md requires.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sport_performance_test
        # Dynamic host port, so parallel jobs on a self-hosted runner do not collide.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sport_performance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The `job` context (mapped host port) only exists at step level, so export it here.
      # Throwaway credentials of the ephemeral service container; not a secret.
      - name: Export DATABASE_URL
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "DATABASE_URL=postgres://postgres:postgres@localhost:${PG_PORT}/sport_performance_test" >>"$GITHUB_ENV"
      - name: Check Postgres connection
        run: psql "$DATABASE_URL" --no-psqlrc --tuples-only --command 'select version();'
      # S3-compatible bucket for the file tests (B-325, ADR 0044). A step and not a service:
      # MinIO needs its `server` command. `pgsty/minio` is the community build (the official
      # image is no longer published), pinned by digest. Throwaway credentials, not a secret.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          port="$(docker port minio 9000/tcp | head -n 1 | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${port}/minio/health/live" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://localhost:${port}/minio/health/live"
          echo "STORAGE_TEST_URL=http://minioadmin:minioadmin123@localhost:${port}" >>"$GITHUB_ENV"
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only job that saves the pnpm store, so each run adds a single entry.
      - uses: ./.github/actions/setup
        with:
          save-pnpm-cache: 'true'
      - run: pnpm build

  # End-to-end tests (B-108, ADR 0096): the real stack (fresh database with the demo club,
  # compiled API and worker, built web) started once, then Playwright on the web and the
  # mobile app's client and sync engine against it. Its own job, in parallel with the others.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Must match the defaults of apps/e2e/src/stack/config.ts (or set E2E_API_PORT/E2E_WEB_PORT).
      E2E_API_URL: http://127.0.0.1:3100
      E2E_WEB_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Throwaway credentials of the ephemeral service container; not a secret.
      - name: Export E2E_DATABASE_URL
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "E2E_DATABASE_URL=postgres://postgres:postgres@localhost:${PG_PORT}/postgres" >>"$GITHUB_ENV"
      # The stack's bucket (the demo club's crest, uploads; ADR 0097): same MinIO as the test job.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          port="$(docker port minio 9000/tcp | head -n 1 | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${port}/minio/health/live" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "http://localhost:${port}/minio/health/live"
          echo "E2E_STORAGE_URL=http://minioadmin:minioadmin123@localhost:${port}" >>"$GITHUB_ENV"
      # The web inlines the API URL at build time (VITE_API_URL is part of Turborepo's hash).
      - name: Build the stack
        env:
          VITE_API_URL: ${{ env.E2E_API_URL }}
        run: >-
          pnpm turbo run build --filter=@sport-performance/api --filter=@sport-performance/worker
          --filter=@sport-performance/web
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @sport-performance/e2e exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install the Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sport-performance/e2e exec playwright install --with-deps chromium
      - name: Install the browser's system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @sport-performance/e2e exec playwright install-deps chromium
      # In the background for the next steps; Playwright reuses it (`reuseExistingServer`).
      - name: Start the stack
        run: |
          node apps/e2e/src/stack/main.ts >"$RUNNER_TEMP/e2e-stack.log" 2>&1 &
          pid=$!
          echo "E2E_STACK_PID=${pid}" >>"$GITHUB_ENV"
          for _ in $(seq 1 300); do
            if curl -fsS "$E2E_WEB_URL" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/e2e-stack.log"; exit 1; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/e2e-stack.log"
          curl -fsS "$E2E_API_URL/health/ready"
      - name: Web (Playwright)
        run: pnpm --filter @sport-performance/e2e e2e
      - name: Mobile (client and sync engine)
        if: ${{ !cancelled() }}
        run: pnpm --filter @sport-performance/mobile test:e2e
      # Stops the children and drops the run's database and logins, like a local run.
      - name: Stop the stack
        if: ${{ always() && env.E2E_STACK_PID != '' }}
        run: |
          kill -TERM "$E2E_STACK_PID" 2>/dev/null || exit 0
          for _ in $(seq 1 30); do
            if ! kill -0 "$E2E_STACK_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          tail -n 5 "$RUNNER_TEMP/e2e-stack.log"
      # Playwright's HTML report plus the trace, screenshot and video of each failed test
      # (`test-results/`), and the logs of the stack and of each of its processes.
      - name: Upload the report and the stack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/.e2e-run/*.log
            ${{ runner.temp }}/e2e-stack.log
          retention-days: 7
          if-no-files-found: ignore

  # The Docker images Railway builds (B-701, ADR 0090): every PR builds and smoke-tests them, so
  # a broken Dockerfile never reaches a deploy. Nothing is pushed anywhere.
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # VITE_API_URL only matters for the web image (it goes into the bundle).
      - name: Build apps/${{ matrix.app }}/Dockerfile
        env:
          APP: ${{ matrix.app }}
        run: docker build --file "apps/${APP}/Dockerfile" --build-arg VITE_API_URL=https://api.example.org --tag "sport-performance-${APP}:ci" .
      - name: Smoke test
        env:
          APP: ${{ matrix.app }}
        run: sh .github/scripts/smoke-image.sh "$APP" "sport-performance-${APP}:ci"

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint also runs shellcheck on every `run:` script. Dependabot's github-actions
      # ecosystem does not update `docker://` refs; Renovate does (see #20, B-107).
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh apps/web/deploy/*.sh
      - name: Test the promotion to production
        run: sh .github/scripts/promote.test.sh
      - name: Test the entrypoint of the web image
        run: sh apps/web/deploy/entrypoint.test.sh
      - name: Test the aggregate check
        run: sh .github/scripts/check-ci-aggregate.test.sh
      - name: Check that `ci` aggregates every job
        run: sh .github/scripts/check-ci-aggregate.sh .github/workflows/ci.yml

  # Single required check. Runs even when a dependency fails so that a failed, cancelled or
  # skipped job makes it fail (a skipped required check would otherwise count as passing).
  ci:
    name: ci
    if: always()
    needs: [format, lint, typecheck, test, build, e2e, images, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi

name: Setup workspace
description: >-
  Installs Node (from .nvmrc) and pnpm (from packageManager), restores the pnpm store,
  runs a frozen install and restores the local Turborepo cache for the calling job.

inputs:
  save-pnpm-cache:
    description: >-
      Save the pnpm store at the end of the job. Every save creates a new cache entry, so only
      one job per run should do it; the others only restore.
    required: false
    default: 'false'
  turbo-cache:
    description: >-
      Restore the local Turborepo cache (.turbo/cache) for this job; pushes to main also save it.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Node version comes from .nvmrc, pnpm version from package.json#packageManager.
    # `require-lockfile` runs `pnpm install --frozen-lockfile`: CI fails if the lockfile is stale.
    - name: Setup pnpm and Node
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        cache: true
        save-cache: ${{ inputs.save-pnpm-cache }}
        require-lockfile: true

    # Only pushes to main save the cache (one entry per job and main commit); PRs and other
    # runs only restore it, so the cache does not grow with every PR commit. A new commit falls
    # back to the job's latest main entry, so untouched packages are Turborepo cache hits.
    - name: Restore and save Turborepo cache
      if: inputs.turbo-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

    - name: Restore Turborepo cache
      if: inputs.turbo-cache == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

# gitleaks configuration (B-107). See docs/security.md.
# Uses the full default rule set; add narrow, commented allowlists only for
# confirmed false positives (never whole directories of source code).
title = "sport-performance"

[extend]
useDefault = true

[[allowlists]]
description = "Generated files without secrets"
paths = [
  # Lockfile integrity hashes are high-entropy but public.
  '''(^|/)pnpm-lock\.yaml$''',
]

[[allowlists]]
description = "Public alphabet of the player access codes (B-310), not a secret"
# Earlier commits of #41 spelled the alphabet of the codes as a literal assigned to
# `PLAYER_ACCESS_CODE_ALPHABET`, which generic-api-key flags by its name ("ACCESS"): first
# the 31 symbols, then the 36 digits and letters they are filtered from. The codes
# themselves are random and never committed; only these two exact public strings are
# allowed (as the secret gitleaks extracts). .gitleaksignore pins the same two findings by
# fingerprint; the current source names the literal without a key word.
regexes = [
  '''^(23456789ABCDEFGHJKMNPQRSTUVWXYZ|0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ)$''',
]

[[allowlists]]
description = "Public test vectors of the pod protocol (B-914, B-916), not secrets"
# The golden vectors of the pod-protocol package (fixtures/v1/vectors.json and
# fixtures/v1/log-vectors.json) publish the AES-128 keys derived with HKDF from the
# fixed test master key 000102…1f (link, storage and beacon keys of epoch 2, and the
# storage key of epoch 3 for the NAND log), so the firmware can check its KDF,
# AES-CCM, AES-CTR and CMAC byte for byte. No club ever uses them. Only these exact
# derived values, and only in those files.
condition = "AND"
paths = [
  '''(^|/)fixtures/v1/(log-)?vectors\.json$''',
]
regexes = [
  '''^(6f96c831eabe814d457fd53b18bb258c|1c41d318a9e89cb33af85e4d4036d65f|eab7326d66d93e14a8f5d01095541722|d10c148671e90a90d92aacd32f6c0936)$''',
]
